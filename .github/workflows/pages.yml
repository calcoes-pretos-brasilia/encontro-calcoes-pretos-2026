name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar site e almanaque completo
        run: |
          mkdir -p _site/assets
          cp index.html style.css almanaque.html _site/
          cp -R assets/. _site/assets/
          cat .almanaque/part-* > _site/assets/ALMANAQUE_v18.pdf
          test "$(wc -c < _site/assets/ALMANAQUE_v18.pdf)" -eq 22783750
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
